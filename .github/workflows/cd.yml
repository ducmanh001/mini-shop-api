# Chỉ build & push image lên GitHub Container Registry sau khi merge vào main (đã qua CI). Không
# tự động deploy lên môi trường chạy thật — bước đó cần tài khoản/credential cloud cụ thể, làm thủ
# công hoặc thêm job riêng khi đã chọn nền tảng (Railway/Render/VPS...).
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
